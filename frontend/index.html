    <header class="header">
      <div class="header-content">
        <h1 class="logo">Djalal Eddine Belkadi</h1>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>

            <line x1="21" y1="12" x2="23" y2="12"></line>

            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Chat Section -->
      <div class="chat-section">
        <div class="chat-header">
          <h2>Chat with me</h2>
          <p class="subtitle">Ask me anything about my experience and skills</p>
        </div>
        <div id="chat" class="chat-messages"></div>
        <form id="form" class="chat-form">
          <div class="input-wrapper">
            <input type="text" id="msg" class="chat-input" placeholder="Type your question here..." autocomplete="off">
            <button type="submit" class="send-button" aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </form>
      </div>

      <!-- Right Panel -->
      <div class="right-panel">
        <!-- Photo Section -->
        <div class="image-section">
          <div class="avatar-circle">
            <img src="./assets/photo_2026-03-19_16-29-18.jpg" alt="Your Photo" class="photo-img">
          </div>
        </div>

        <!-- Question Suggestions -->
        <div class="suggestions-section">
          <button class="suggestion-btn" data-question="Tell me about your background and experience">About your
            background</button>
          <button class="suggestion-btn" data-question="What are your main technical skills?">Your main
            skills</button>
          <button class="suggestion-btn" data-question="What projects have you worked on?">Notable projects</button>
          <button class="suggestion-btn" data-question="How can I work with you?">How to work together</button>
        </div>

        <!-- Skills Section -->
        <div class="skills-section">
          <h3 class="skills-title">Skills</h3>
          <ul class="skills-list">
            <li class="skill-item">Python</li>
            <li class="skill-item">Machine Learning</li>
            <li class="skill-item">Deep Learning</li>
            <li class="skill-item">Natural Language Processing</li>
            <li class="skill-item">Computer Vision</li>
            <li class="skill-item">Data Science</li>
          </ul>
        </div>
